###
### Ejabberd Configuration File
###

hosts:
  - "@HOST@"

loglevel: info

certfiles:
  - "/opt/ejabberd/conf/server.pem"

auth_method: [ jwt ]
jwt_key: "@KEYCLOAK_URL@"
jwt_jid_field: "jid"

default_db: sql
sql_type: pgsql
sql_server: "@DB_SERVER@"
sql_database: "@DB_DATABASE@"
sql_username: "@DB_USERNAME@"
sql_password: "@DB_PASSWORD@"
sql_port: 5432
sql_schema_multihost: true
update_sql_schema: false

listen:
  - port: 5222
    ip: "::"
    module: ejabberd_c2s
    starttls: true
  - port: 5280
    ip: "::"
    module: ejabberd_http
    request_handlers:
      "/admin": ejabberd_web_admin
      "/api": mod_http_api
      "/ws": ejabberd_http_ws

acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128
      - ::FFFF:127.0.0.1/128
  admin:
    user:
      - "@ADMIN_USER@": "@HOST@"

access_rules:
  local:
    - allow: local
  c2s:
    - allow
  announce:
    - allow: admin
  configure:
    - allow: admin
  muc_create:
    - allow: local
  pubsub_createnode:
    - allow: local
  trusted_network:
    - allow: loopback

api_permissions:
  "console commands":
    from:
      - ejabberd_ctl
    who: all
    what: "*"
  "admin access":
    who:
      access:
        allow:
          - acl: loopback
          - acl: admin
    what:
      - "*"
      - "!stop"
      - "!start"

modules:
  mod_adhoc: { }
  mod_admin_extra: { }
  mod_announce:
    access: announce
  mod_blocking: { }
  mod_caps: { }
  mod_carboncopy: { }
  mod_configure: { }
  mod_disco: { }
  mod_http_api: { }
  mod_last: { }
  mod_mam:
    default: always
  mod_muc:
    access:
      - allow
    access_admin:
      - allow: admin
    access_create: muc_create
    access_persistent: muc_create
    default_room_options:
      mam: true
  mod_offline: { }
  mod_ping: { }
  mod_privacy: { }
  mod_private: { }
  mod_pubsub:
    access_createnode: pubsub_createnode
    plugins:
      - "flat"
      - "pep"
  mod_push: { }
  mod_push_keepalive: { }
  mod_roster:
    versioning: true
  mod_stream_mgmt:
    resend_on_timeout: if_offline
  mod_time: { }
  mod_vcard: { }
  mod_version: { }