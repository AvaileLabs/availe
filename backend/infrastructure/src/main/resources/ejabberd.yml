###
### Ejabberd Configuration File
###

hosts:
  - "@HOST@"

loglevel: 4
log_rotate_size: 10485760
log_rotate_count: 5

certfiles:
  - "/opt/ejabberd/conf/server.pem"

listen:
  - port: 5222
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    starttls_required: false
  - port: 5280
    ip: "::"
    module: ejabberd_http
    request_handlers:
      "/admin": ejabberd_web_admin
      "/api": mod_http_api

auth_method: [ sql ]
default_db: sql
new_sql_schema: true

sql_type: pgsql
sql_server: "@DB_SERVER@"
sql_database: "@DB_DATABASE@"
sql_username: "@DB_USERNAME@"
sql_password: "@DB_PASSWORD@"
sql_port: 5432

acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128
      - ::FFFF:127.0.0.1/128
  admin:
    user:
      - "@ADMIN_USER@": "@HOST@"

access_rules:
  local:
    - allow: local
  c2s:
    - deny: blocked
    - allow
  announce:
    - allow: admin
  configure:
    - allow: admin
  muc_create:
    - allow: local
  pubsub_createnode:
    - allow: local
  trusted_network:
    - allow: loopback

api_permissions:
  "console commands":
    from:
      - ejabberd_ctl
    who: all
    what: "*"
  "admin access":
    who:
      access:
        allow:
          - acl: loopback
          - acl: admin
      oauth:
        scope: "ejabberd:admin"
        access:
          allow:
            - acl: loopback
            - acl: admin
    what:
      - "*"
      - "!stop"
      - "!start"

shaper:
  normal: 1000
  fast: 50000

shaper_rules:
  max_user_sessions: 10
  max_user_offline_messages:
    - 5000: admin
    - 100
  c2s_shaper:
    - none: admin
    - normal
  s2s_shaper: fast

modules:
  mod_adhoc: { }
  mod_admin_extra: { }
  mod_announce:
    access: announce
  mod_avatar: { }
  mod_blocking: { }
  mod_bosh: { }
  mod_caps: { }
  mod_carboncopy: { }
  mod_client_state: { }
  mod_configure: { }
  mod_disco: { }
  mod_fail2ban: { }
  mod_http_api: { }
  mod_last: { }
  mod_mam:
    default: always
  mod_mqtt: { }
  mod_muc:
    access:
      - allow
    access_admin:
      - allow: admin
    access_create: muc_create
    access_persistent: muc_create
    default_room_options:
      mam: true
  mod_muc_admin: { }
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_ping: { }
  mod_privacy: { }
  mod_private: { }
  mod_pubsub:
    access_createnode: pubsub_createnode
    plugins:
      - "flat"
      - "pep"
    force_node_config:
      "eu.siacs.conversations.axolotl.*":
        access_model: open
      "storage:bookmarks":
        access_model: whitelist
  mod_push: { }
  mod_push_keepalive: { }
  mod_register:
    ip_access: trusted_network
    access: remove
  mod_roster:
    versioning: true
  mod_shared_roster: { }
  mod_stats: { }
  mod_time: { }
  mod_vcard: { }
  mod_vcard_xupdate: { }
  mod_version: { }
  mod_stream_mgmt:
    resend_on_timeout: if_offline
  mod_s2s_dialback: { }